quest/awakening = 苏醒
quest/awakening/0 = 在小巷里光着身子醒来。头疼得要裂开。看看四周——找点东西穿上。
quest/awakening/1 = 用一块破布遮住身子，抓起了那本书。这时警察来了。没必要争辩——快跑。
quest/awakening/2 = 哨声平息了。我在墓地。喘口气，想想该拿这本书怎么办。
quest/awakening/3 = 把它大声念了出来。我肯定做了什么。可到底是什么？
quest/awakening/4 = 书开口说话了。它自称阿尔·阿齐夫。该离开这里了。
quest/awakening/5 = 沿着河岸走向别墅。在那边找个地方先躲一阵。
