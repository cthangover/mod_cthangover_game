quest/awakening/2 = 호루라기 소리가 잦아들었다. 나는 묘지에 있다. 숨을 고르고 이 책을 어떻게 할지 생각하자.
quest/awakening/3 = 소리 내어 읽었다. 분명 뭔가를 해 버렸다. 그런데 대체 뭘?
quest/awakening/4 = 책이 말을 하기 시작했다. 자신을 알 아지프라고 부른다. 여기서 벗어나야 한다.
quest/awakening/5 = 강을 따라 저택으로 걸어간다. 그쪽 어딘가에서 잠시 숨어 지내자.
