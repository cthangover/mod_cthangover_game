quest/awakening/4 = Cuốn sách bắt đầu nói. Nó tự xưng là Al Azif. Phải rời khỏi đây thôi.
quest/awakening/5 = Đi dọc bờ sông tới biệt thự. Tôi sẽ trốn ở đâu đó quanh đó một thời gian.
