quest/awakening = El despertar
quest/awakening/0 = Me desperté desnudo en un callejón. La cabeza me va a estallar. Mira alrededor y busca algo que ponerte.
quest/awakening/1 = Me tapé con un trapo y cogí el libro. Entonces apareció la policía. No vale la pena discutir: a correr.
quest/awakening/2 = Los silbatos se han callado. Estoy en el cementerio. Recupera el aliento y piensa qué hacer con el libro.
quest/awakening/3 = Lo leí en voz alta. Estoy bastante seguro de que hice algo. ¿Pero qué exactamente?
quest/awakening/4 = El libro empezó a hablar. Dice llamarse Al Azif. Hay que largarse de aquí.
quest/awakening/5 = Voy por la orilla del río hacia la villa. Me esconderé por allí un tiempo.
